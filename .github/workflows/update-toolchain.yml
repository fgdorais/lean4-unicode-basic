name: Update Toolchain

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

jobs:
  update-toolchain:
    name: update toolchain
    runs-on: ubuntu-latest
    steps:

      - name: checkout
        uses: actions/checkout@v7
        with:
          ref: nightly-testing
          fetch-depth: 0

      - name: install jq
        uses: dcarbone/install-jq-action@v4

      - name: get toolchain tags
        id: toolchain-tag
        run: |
          REPO_TAG=$(git show main:lean-toolchain | cut -d':' -f2 | tr -d '\n')
          LEAN_TAG=$(curl -s "https://api.github.com/repos/leanprover/lean4/releases" | jq -r '.[0].tag_name' | tr -d '\n')
          echo "repo_tag=$REPO_TAG" >> $GITHUB_OUTPUT
          echo "lean_tag=$LEAN_TAG" >> $GITHUB_OUTPUT

      - name: update toolchain
        id: update
        if: ${{ steps.toolchain-tag.outputs.lean_tag != steps.toolchain-tag.outputs.repo_tag }}
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          echo "leanprover/lean4:${{ steps.toolchain-tag.outputs.lean_tag }}" > lean-toolchain

      - name: create pull request
        id: cpr
        if: ${{ steps.toolchain-tag.outputs.lean_tag != steps.toolchain-tag.outputs.repo_tag }}
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.UNICODE_BASIC_TOKEN }}
          commit-message: "chore: update toolchain ${{ steps.toolchain-tag.outputs.lean_tag }}"
          branch: update-toolchain-${{ steps.toolchain-tag.outputs.lean_tag }}
          base: main
          delete-branch: true
          title: "chore: update toolchain ${{ steps.toolchain-tag.outputs.lean_tag }}"

      - name: merge pull request when checks pass
        if: ${{ steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated' }}
        timeout-minutes: 180
        env:
          GH_TOKEN: ${{ secrets.UNICODE_BASIC_TOKEN }}
          PR: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          # wait for the pull request's checks to start, then for them to pass
          for i in $(seq 1 30); do
            if [ "$(gh pr checks "$PR" --repo "$GITHUB_REPOSITORY" --json name --jq length 2>/dev/null || echo 0)" != "0" ]; then break; fi
            sleep 20
          done
          gh pr checks "$PR" --repo "$GITHUB_REPOSITORY" --watch --fail-fast --interval 60
          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --squash --delete-branch
